name: 每日自动运行Coze查重工作流
on:
  schedule:
    - cron: '00 02 * * *'  # 北京时间10:00运行（UTC 02:00），可按需修改
  workflow_dispatch:  # 手动触发开关

jobs:
  run-coze-workflow:
    runs-on: ubuntu-latest
    steps:
      - name: 调用Coze工作流
        uses: fjogeleit/http-request-action@v1
        with:
          # Coze工作流调用URL（保持不变）
          url: "https://api.coze.cn/v1/workflow/stream_run"
          # 请求方法固定为POST
          method: "POST"
          # 新的授权令牌（仅保留pat后的内容，去掉Bearer前缀）
          bearerToken: "cztei_q8rjuiE4JlGnyGETUPdd8xZj5aJpNK7QaSO2Pnv2FdrnKE1vNfblI60qliAti4NwB"
          # 请求内容类型
          contentType: "application/json"
          # 工作流参数（保持不变）
          data: '{
            "workflow_id": "7581688621460308004",
            "parameters": {
              "orgA_table_url": "https://ai.feishu.cn/base/DI70b7aaAavGqqsP5TTczFiJn8g?table=tblwA4rkA67A1WTD&view=vewkcLhO81",
              "orgB_table_url": "https://ai.feishu.cn/base/DI70b7aaAavGqqsP5TTczFiJn8g?table=tbljqt1Mb2erfwMH&view=vewPyiygfT"
            }
          }'
