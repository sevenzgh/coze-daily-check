name: 每周一自动运行Coze查重工作流
on:
  schedule:
    - cron: '00 02 * * 1'  # 含义：每周一 UTC时间02:00 = 北京时间10:00
  workflow_dispatch:  # 保留手动触发功能

jobs:
  run-coze-workflow:
    runs-on: ubuntu-latest
    steps:
      - name: 调用Coze工作流（用curl命令）
        run: |
          curl -X POST 'https://api.coze.cn/v1/workflow/stream_run' \
          -H "" \
          -H "Content-Type: application/json" \
          -d '{
            "workflow_id": "7581688621460308004",
            "parameters": {
              "orgA_table_url": "https://ai.feishu.cn/base/DI70b7aaAavGqqsP5TTczFiJn8g?table=tblwA4rkA67A1WTD&view=vewkcLhO81",
              "orgB_table_url": "https://ai.feishu.cn/base/DI70b7aaAavGqqsP5TTczFiJn8g?table=tbljqt1Mb2erfwMH&view=vewPyiygfT"
            }
          }' \
          --max-time 600  # 10分钟超时
