name: 每日自动运行Coze查重工作流
# 定时触发规则：UTC 02:00 = 北京时间10:00（可按需修改）
on:
  schedule:
    - cron: '00 02 * * *'
  # 手动触发选项（方便测试）
  workflow_dispatch:

jobs:
  run-coze-workflow:
    runs-on: ubuntu-latest
    steps:
      - name: 调用Coze工作流
        uses: fjogeleit/http-request-action@v1
        with:
          # 对应Curl里的URL（注意是coze.cn不是coze.com）
          url: "https://api.coze.cn/v1/workflow/stream_run"
          # 请求方法固定为POST
          method: "POST"
          # 对应Curl里的请求头（必须保留，Coze验证身份用）
          headers: '{"Authorization": "Bearer pat_wkzi9FUbFjBvB6Gmw2wpr5tpt6DxdTUiVCEwkAQptogXTEzhgL8iruE3ifGX7u8q", "Content-Type": "application/json"}'
          # 对应Curl里的参数（必须保留，指定要运行的工作流和表地址）
          data: '{
            "workflow_id": "7581688621460308004",
            "parameters": {
              "orgA_table_url": "https://ai.feishu.cn/base/DI70b7aaAavGqqsP5TTczFiJn8g?table=tblwA4rkA67A1WTD&view=vewkcLhO81",
              "orgB_table_url": "https://ai.feishu.cn/base/DI70b7aaAavGqqsP5TTczFiJn8g?table=tbljqt1Mb2erfwMH&view=vewPyiygfT"
            }
          }'
