name: 每日自动运行Coze查重工作流
on:
  schedule:
    - cron: '00 02 * * *'  # 北京时间10:00运行
  workflow_dispatch:

jobs:
  run-coze-workflow:
    runs-on: ubuntu-latest
    steps:
      - name: 调用Coze工作流
        uses: fjogeleit/http-request-action@v1
        with:
          # Coze工作流调用URL
          url: "https://api.coze.cn/v1/workflow/stream_run"
          # 请求方法
          method: "POST"
          # 自动生成Authorization: Bearer 令牌（只需填令牌内容，无需加“Bearer ”前缀）
          bearerToken: "pat_wkzi9FUbFjBvB6Gmw2wpr5tpt6DxdTUiVCEwkAQptogXTEzhgL8iruE3ifGX7u8q"
          # 设置请求内容类型
          contentType: "application/json"
          # 工作流参数（保持原内容）
          data: '{
            "workflow_id": "7581688621460308004",
            "parameters": {
              "orgA_table_url": "https://ai.feishu.cn/base/DI70b7aaAavGqqsP5TTczFiJn8g?table=tblwA4rkA67A1WTD&view=vewkcLhO81",
              "orgB_table_url": "https://ai.feishu.cn/base/DI70b7aaAavGqqsP5TTczFiJn8g?table=tbljqt1Mb2erfwMH&view=vewPyiygfT"
            }
          }'
